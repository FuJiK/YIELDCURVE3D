name: Update yield curve dashboard

on:
  schedule:
    # Weekdays 21:00 UTC (06:00 JST next calendar day) — daily refresh is enough for Treasury yields
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yield-curve-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard HTML
        env:
          QUANDL_API_KEY: ${{ secrets.QUANDL_API_KEY }}
        run: python yield_curve_3d_us.py

      - name: Deploy production site (gh-pages + custom domain)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: dashboard.theshibsters.com

      - name: Commit dashboard artifacts on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html dist/index.html
          if git diff --staged --quiet; then
            echo "No HTML changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh US yield curve 3D dashboard"
          git push